apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgp-app-quality
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edgp-app-quality
  template:
    metadata:
      labels:
        app: edgp-app-quality
    spec:
      containers:
        - name: edgp-app-quality
          image: public.ecr.aws/q1b5w5y6/edgp-app-quality:VERSION
          imagePullPolicy: Always
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: SPRING_PROFILES_ACTIVE
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: AWS_REGION
            - name: WORKFLOW_DEDUPLICATION_REQUEST_SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: WORKFLOW_DEDUPLICATION_REQUEST_SQS_URL
            - name: WORKFLOW_DEDUPLICATION_RESPONSE_SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: WORKFLOW_DEDUPLICATION_RESPONSE_SQS_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: aws_edgp_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: aws_edgp_secret_key_id
          resources:
           requests:
             cpu: "50m"
             memory: "250Mi"
           limits:
             cpu: "350m"
             memory: "500Mi"
